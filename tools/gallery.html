<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>포캣몬 스프라이트 갤러리</title>
<style>
  body { margin: 0; background: #20283a; font-family: sans-serif; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(12, 128px); gap: 6px; padding: 6px 8px; }
  h2 { font-size: 13px; font-weight: normal; margin: 6px 8px 0; color: #9fb0d0; }
  figure { margin: 0; background: repeating-conic-gradient(#3a4560 0 25%, #2c3550 0 50%) 0 0 / 16px 16px; border-radius: 6px; overflow: hidden; }
  img { width: 128px; height: 128px; display: block; }
  figcaption { font-size: 11px; padding: 2px 5px; background: #111827; white-space: nowrap; }
</style>
</head>
<body>
<h2>기본</h2>
<div class="grid" id="g"></div>
<h2>이로치</h2>
<div class="grid" id="gs"></div>
<script src="../js/sprites.js"></script>
<script>
  // 진화형(<id>2)은 기본형 바로 뒤에 둔다 — 한 줄 12칸에 기본·진화 6쌍
  var ids = ['naru', 'naru2', 'seol', 'seol2', 'ssaga', 'ssaga2', 'cheese', 'cheese2', 'flare', 'flare2',
    'leaf', 'leaf2', 'zap', 'zap2', 'punch', 'punch2', 'venom', 'venom2', 'sand', 'sand2',
    'wing', 'wing2', 'psy', 'psy2', 'moth', 'moth2', 'rock', 'rock2', 'ghost', 'ghost2',
    'dragon', 'dragon2', 'iron', 'iron2', 'ribbon', 'ribbon2', 'metal', 'black'];
  window.loaded = 0; window.failed = [];
  window.expected = ids.length + ids.filter(function (id) { return Sprites.hasShiny(id); }).length;
  [false, true].forEach(function (shiny) {
    var g = document.getElementById(shiny ? 'gs' : 'g');
    ids.forEach(function (id) {
      if (shiny && !Sprites.hasShiny(id)) return;  // 이로치가 없는 몬스터는 이로치 줄에서 뺀다
      var f = document.createElement('figure');
      var im = new Image();
      im.onload = function () { window.loaded++; };
      im.onerror = function () { window.failed.push(id + (shiny ? '*' : '')); };
      im.src = Sprites.spriteURL(id, { shiny: shiny });
      im.dataset.id = id;
      f.appendChild(im);
      var c = document.createElement('figcaption');
      c.textContent = id + (shiny ? ' (이로치)' : '');
      f.appendChild(c);
      g.appendChild(f);
    });
  });
</script>
</body>
</html>
